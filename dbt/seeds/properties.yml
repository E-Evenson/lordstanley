seeds:
  - name: drafts
    description: Lord Stanley draft data
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - season
            - team_abbrev
    columns:
      - name: season
        description: "NHL season ID"
        data_tests:
          - not_null
      - name: team_abbrev
        description: "NHL team tricode"
        data_tests:
          - not_null
      - name: owner
        description: "Team owner"
        data_tests:
          - not_null